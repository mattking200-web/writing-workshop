<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Writing Workshop ✏️</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--mint:#4ade80;--mint-dark:#16a34a;--sky:#38bdf8;--sky-dark:#0284c7;--coral:#fb7185;--coral-dark:#e11d48;--yellow:#fbbf24;--purple:#a78bfa;--bg:#f0fdf4;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);background-image:radial-gradient(circle at 15% 15%,#dcfce7 0%,transparent 45%),radial-gradient(circle at 85% 85%,#ffe4e6 0%,transparent 45%);min-height:100vh;color:var(--text);padding:16px;}
h1,h2,h3{font-family:'Fredoka One',cursive;letter-spacing:.02em;}
.container{max-width:720px;margin:0 auto;}
.header{background:#fff;border-radius:24px;padding:18px 22px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:2px solid #dcfce7;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.header-left h1{font-size:1.6rem;color:var(--coral-dark);}
.breadcrumb{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.streak-box{text-align:right;}
.streak-lbl{font-size:.58rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:.12em;}
.streak-val{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--mint-dark);line-height:1.1;}
.streak-dots{display:flex;gap:3px;justify-content:flex-end;margin-top:5px;}
.s-dot{width:14px;height:5px;border-radius:99px;background:#e2e8f0;}
.s-dot.on{background:var(--mint-dark);}.s-dot.off{background:var(--coral);}
.teacher-toggle{display:flex;align-items:center;gap:6px;background:#f1f5f9;padding:7px 12px;border-radius:99px;font-size:.72rem;font-weight:800;color:#475569;cursor:pointer;user-select:none;border:2px solid transparent;transition:all .2s;}
.teacher-toggle.active{background:#ede9fe;color:#7c3aed;border-color:#c4b5fd;}
.teacher-toggle .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;}
.teacher-toggle.active .dot{background:#7c3aed;}
.back-btn{background:#f1f5f9;border:none;border-radius:99px;padding:7px 14px;font-family:'Fredoka One',cursive;font-size:.85rem;cursor:pointer;color:#475569;}
.back-btn:hover{background:#e2e8f0;}
.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:2px solid #f1f5f9;}
.card h2{font-size:1.15rem;margin-bottom:16px;color:var(--text);}
.grid{display:flex;flex-direction:column;gap:10px;}
.pick-card{background:linear-gradient(135deg,#f0fdf4,#fff1f2);border:2px solid #dcfce7;border-radius:16px;padding:16px 18px;cursor:pointer;transition:all .2s;text-align:left;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:14px;}
.pick-card:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:0 4px 14px rgba(251,113,133,.2);}
.pick-card.locked{opacity:.55;cursor:not-allowed;}
.pick-card.locked:hover{transform:none;box-shadow:none;border-color:#dcfce7;}
.pick-icon{font-size:1.8rem;}
.pick-card .title{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--sky-dark);margin-bottom:3px;}
.pick-card .sub{font-size:.8rem;color:var(--muted);font-weight:700;}
.level-grid{display:flex;flex-wrap:wrap;gap:8px;}
.lvl-btn{padding:12px 18px;border:2px solid var(--border);border-radius:12px;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;background:#fff;color:var(--text);transition:all .15s;min-width:56px;position:relative;}
.lvl-btn:hover:not(:disabled){border-color:var(--coral);background:#fff1f2;transform:translateY(-1px);}
.lvl-btn.active{background:var(--coral-dark);border-color:var(--coral-dark);color:#fff;}
.lvl-btn:disabled{opacity:.4;cursor:not-allowed;}
.lvl-btn .reps-tag{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-family:'Nunito',sans-serif;font-size:.55rem;font-weight:900;background:#fef9c3;color:#92400e;border-radius:99px;padding:1px 6px;white-space:nowrap;}
.btn{padding:11px 20px;border:none;border-radius:12px;font-family:'Fredoka One',cursive;font-size:.98rem;cursor:pointer;transition:transform .15s,opacity .2s;letter-spacing:.04em;}
.btn:hover:not(:disabled){transform:translateY(-2px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.btn-green{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff;}
.btn-sky{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;}
.btn-coral{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff;}
.btn-purple{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;}
.btn-ghost{background:#f1f5f9;color:#475569;}
.btn-lg{padding:16px 26px;font-size:1.2rem;width:100%;border-radius:16px;}
.write-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.write-top .pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pill{padding:4px 12px;border-radius:99px;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;}
.pill-coral{background:#ffe4e6;color:var(--coral-dark);}
.pill-sky{background:#dbeafe;color:#1d4ed8;}
.pill-purple{background:#ede9fe;color:#6d28d9;}
.rep-dots{display:flex;gap:4px;align-items:center;margin-bottom:14px;}
.rep-dot{width:22px;height:8px;border-radius:99px;background:#e2e8f0;}
.rep-dot.done{background:var(--mint-dark);}
.rep-dot.current{background:var(--coral);}
.prompt-box{background:linear-gradient(135deg,#fff1f2,#eff6ff);border-radius:18px;padding:20px 20px;border:3px solid #ffe4e6;margin-bottom:16px;}
.prompt-title{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--coral-dark);margin-bottom:6px;}
.prompt-text{font-size:1.25rem;line-height:1.6;font-weight:700;color:var(--text);}
.exemplar-box{margin-top:10px;padding:10px 14px;background:#ede9fe;border:2px solid #c4b5fd;border-radius:12px;font-size:.85rem;color:#5b21b6;font-weight:700;white-space:pre-line;}
.exemplar-lbl{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#7c3aed;margin-bottom:3px;}
.starter-box{background:#eff6ff;border:2px solid #bfdbfe;border-radius:12px;padding:12px 15px;margin-bottom:12px;font-weight:800;color:#1e40af;font-size:1.05rem;}
.starter-lbl{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#60a5fa;margin-bottom:4px;}
.rehearsal-box{background:linear-gradient(135deg,#fef9c3,#fef3c7);border:3px solid var(--yellow);border-radius:16px;padding:16px 18px;margin-bottom:16px;text-align:center;}
.rehearsal-box.done{background:#f0fdf4;border-color:var(--mint);padding:10px 18px;}
.rehearsal-title{font-family:'Fredoka One',cursive;font-size:1.1rem;color:#92400e;margin-bottom:6px;}
.rehearsal-box.done .rehearsal-title{color:var(--mint-dark);font-size:.95rem;}
.rehearsal-sub{font-size:.85rem;font-weight:700;color:#92400e;margin-bottom:12px;}
.rehearsal-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.scribe-row{margin-top:10px;font-size:.78rem;color:#92400e;}
.scribe-row label{display:inline-flex;align-items:center;gap:6px;font-weight:700;cursor:pointer;}
textarea:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed;}
.btn-coral:disabled{background:#f1f5f9;color:#94a3b8;}
.wordbank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.wb-chip{background:#fef9c3;border:2px solid #fde68a;color:#92400e;padding:6px 13px;border-radius:99px;font-weight:800;font-size:.88rem;}
.checklist-side{background:#f8fafc;border:2px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.checklist-side-title{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
.checklist-side ul{list-style:none;}
.checklist-side li{font-size:.88rem;font-weight:700;color:var(--text);padding:4px 0;display:flex;align-items:center;gap:8px;}
.checklist-side li:before{content:"☐";color:#94a3b8;font-size:1.05rem;}
textarea{width:100%;min-height:140px;padding:16px;border:3px solid var(--border);border-radius:16px;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:700;color:var(--text);resize:vertical;line-height:1.6;}
textarea:focus{outline:none;border-color:var(--coral);}
.word-count{text-align:right;font-size:.75rem;font-weight:800;color:var(--muted);margin:6px 0 16px;}
.results-card{border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.07);}
.results-card.success{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:3px solid #86efac;}
.results-card.fail{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:3px solid #fdba74;}
.score-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;}
.score-num{font-family:'Fredoka One',cursive;font-size:2.4rem;color:var(--text);line-height:1;}
.score-lbl{font-size:.68rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.badge{padding:7px 17px;border-radius:99px;font-family:'Fredoka One',cursive;font-size:.88rem;}
.badge.s{background:#22c55e;color:#fff;}.badge.f{background:#f97316;color:#fff;}
.rep-progress-line{font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:16px;}
.annotated-box{background:rgba(255,255,255,.7);border-radius:13px;padding:16px;margin-bottom:16px;font-size:1.15rem;line-height:1.8;font-weight:700;}
.mk-ok{text-decoration:underline;text-decoration-color:#16a34a;text-decoration-thickness:3px;}
.mk-bad{text-decoration:underline;text-decoration-color:#ef4444;text-decoration-thickness:3px;}
.mk-trait{background:#fef08a;border-radius:3px;padding:0 2px;}
.check-results{padding:14px 16px;background:rgba(255,255,255,.6);border-radius:13px;margin-bottom:16px;}
.check-item{font-size:.92rem;font-weight:800;padding:5px 0;display:flex;align-items:center;gap:8px;}
.check-item.pass{color:#16a34a;}
.check-item.miss{color:#dc2626;}
.tip-box{background:#fefce8;border-radius:13px;padding:13px 16px;border:2px solid #fde68a;margin-bottom:16px;font-size:.9rem;font-weight:700;color:#92400e;line-height:1.55;}
.tip-box .tip-title{font-family:'Fredoka One',cursive;color:#d97706;margin-bottom:4px;font-size:.95rem;}
.action-row{display:flex;gap:9px;flex-wrap:wrap;}
.action-row .btn{flex:1;min-width:110px;}
.quiz-wrap{background:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:2px solid #e0e7ff;}
.quiz-wrap h2{font-size:1.15rem;color:#4338ca;margin-bottom:4px;}
.quiz-sub{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:18px;}
.quiz-q{margin-bottom:18px;}
.quiz-q-text{font-weight:800;font-size:.95rem;color:var(--text);margin-bottom:9px;line-height:1.45;}
.quiz-opts{display:flex;flex-direction:column;gap:7px;}
.qopt{padding:11px 15px;border:2px solid var(--border);border-radius:12px;background:#fff;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;color:var(--text);}
.qopt:hover:not(:disabled){border-color:#818cf8;background:#eef2ff;transform:translateX(3px);}
.qopt.selected{border-color:#6366f1;background:#eef2ff;color:#4338ca;}
.qopt.correct{border-color:#16a34a!important;background:#dcfce7!important;color:#15803d!important;}
.qopt.wrong{border-color:#dc2626!important;background:#fee2e2!important;color:#b91c1c!important;}
.qopt:disabled{cursor:not-allowed;transform:none!important;}
.quiz-score{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-radius:16px;padding:16px 20px;text-align:center;margin-top:12px;}
.quiz-score-big{font-family:'Fredoka One',cursive;font-size:2.2rem;color:#4338ca;}
.quiz-score-msg{font-weight:800;font-size:.9rem;color:#6366f1;margin-top:4px;}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.confetti-piece{position:fixed;top:-12px;z-index:9999;pointer-events:none;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0.4;}}
.celebrate-banner{text-align:center;padding:22px 16px;margin-bottom:16px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:3px solid #4ade80;border-radius:20px;animation:celebratePop .5s ease;}
.celebrate-banner .celebrate-emoji{font-size:3rem;line-height:1;margin-bottom:6px;}
.celebrate-banner .celebrate-text{font-family:'Fredoka One',cursive;font-size:2rem;line-height:1.15;color:#15803d;}
.celebrate-banner .celebrate-sub{font-size:1.05rem;font-weight:800;color:#16a34a;margin-top:8px;}
.celebrate-banner.big{background:linear-gradient(135deg,#fef9c3,#fde68a);border-color:#fbbf24;}
.celebrate-banner.big .celebrate-emoji{font-size:3.8rem;}
.celebrate-banner.big .celebrate-text{font-size:2.4rem;color:#92400e;}
.celebrate-banner.big .celebrate-sub{color:#b45309;}
@keyframes celebratePop{0%{transform:scale(0.55);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);opacity:1;}}
@media(max-width:480px){.celebrate-banner .celebrate-text{font-size:1.6rem;}.celebrate-banner.big .celebrate-text{font-size:1.9rem;}}
.slide-up{animation:slideUp .35s ease;}
footer{text-align:center;padding:16px 0;font-size:.7rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:.15em;}
@media(max-width:480px){.prompt-text{font-size:1.05rem;}.annotated-box{font-size:1rem;}}
@media print{body{background:#fff;padding:0;}.header,.card,#quiz-area,.action-row,footer,.teacher-toggle,.back-btn{display:none!important;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>Writing Workshop ✏️</h1>
      <div class="breadcrumb" id="breadcrumb">Pick a grade to start</div>
      <div id="student-badge" style="display:none;margin-top:4px;"></div>
    </div>
    <div class="header-right">
      <div class="streak-box">
        <div class="streak-lbl">Streak</div>
        <div class="streak-val" id="streak-val">🔥 0</div>
        <div class="streak-dots" id="streak-dots"></div>
      </div>
      <div class="teacher-toggle" id="teacher-toggle" onclick="toggleTeacher()">
        <span class="dot"></span><span>Teacher Mode</span>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <div id="quiz-area"></div>
  <footer>Writing Workshop · Ontario Grades 1–3</footer>
</div>

<script>
// ── DATA ──
const DATA = {
  1:{ label:'Grade 1', sub:'Ages 6–7', units:{
    'sentences-about-me':{
      title:'Sentences About Me', sub:'Write sentences about your favorite things', icon:'✏️', available:true,
      levels:[
        { reps:2, scaffoldType:'wordbank-starter',
          target:{minWords:4, minSentences:1, traitWords:[]},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 4 words","Names one thing","Uses different words (not just repeating one)"],
          hints:["What color is it?","Where do you see it?","What does it like to do?"],
          prompts:[
            { text:"Write one sentence about your favorite animal.", starter:"My favorite animal is ___.", wordBank:["dog","cat","lion","panda","horse","rabbit","elephant","turtle"], exemplar:"My favorite animal is a panda." },
            { text:"Write one sentence about your favorite toy.", starter:"My favorite toy is ___.", wordBank:["blocks","doll","truck","ball","puzzle","robot","kite","yo-yo"], exemplar:"My favorite toy is my red truck." },
            { text:"Write one sentence about your favorite color.", starter:"My favorite color is ___.", wordBank:["red","blue","green","purple","yellow","pink","orange","black"], exemplar:"My favorite color is blue." }
          ] },
        { reps:2, scaffoldType:'starter',
          target:{minWords:6, minSentences:1, traitWords:["because","since","that's why","that is why"], extraWordsBonus:4},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 6 words","Gives a reason (a word like \"because\", or extra detail explaining why)","Uses different words (not just repeating one)"],
          hints:["What does it taste like?","How does it make you feel?","When do you like it best?"],
          prompts:[
            { text:"Write one sentence about your favorite food, and tell why you like it.", starter:"My favorite food is ___ because ___.", exemplar:"My favorite food is pizza because it is cheesy and warm." },
            { text:"Write one sentence about your favorite season, and tell why.", starter:"My favorite season is ___ because ___.", exemplar:"My favorite season is summer because I get to swim." },
            { text:"Write one sentence about your favorite thing to do at school, and tell why.", starter:"My favorite thing to do at school is ___ because ___.", exemplar:"My favorite thing to do at school is art because I like to paint." }
          ] },
        { reps:3, scaffoldType:'starter',
          target:{minWords:8, minSentences:2, traitWords:["because","since","that's why","that is why"], extraWordsBonus:4},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 2 sentences","Gives a reason (a word like \"because\", or extra detail explaining why)","Uses different words (not just repeating one)"],
          hints:["Who do you do it with?","How does it make you feel?","Where do you do it?"],
          prompts:[
            { text:"Write two sentences about something you like to do. Tell what it is and why it is fun.", starter:"I like to ___. It is fun because ___.", exemplar:"I like to ride my bike. It is fun because I go fast." },
            { text:"Write two sentences about a game you like to play. Tell what it is and why it is fun.", starter:"I like to play ___. It is fun because ___.", exemplar:"I like to play tag. It is fun because I run fast." },
            { text:"Write two sentences about a place you like to go. Tell where it is and why you like it.", starter:"I like to go to ___. It is fun because ___.", exemplar:"I like to go to the park. It is fun because I can swing." }
          ] },
        { reps:3, scaffoldType:'checklist-only',
          target:{minWords:12, minSentences:3, traitWords:[]},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 3 sentences","Stays on topic (about you)","Uses different words (not just repeating one)"],
          hints:["What do you like about it?","When did you find out you were good at it?","Who knows this about you?"],
          prompts:[
            { text:"Write three sentences about yourself: your name, something you like, and something you are good at.", exemplar:"My name is Sam. I like drawing dinosaurs. I am good at soccer." },
            { text:"Write three sentences: your name, your favorite season, and something you are good at.", exemplar:"My name is Mia. My favorite season is winter. I am good at building snowmen." },
            { text:"Write three sentences: your name, a place you like to go, and something you like to do there.", exemplar:"My name is Alex. I like to go to the library. I like to read comic books there." }
          ] },
        { reps:3, scaffoldType:'checklist-only',
          target:{minWords:10, minSentences:2, traitWords:["big","small","soft","fuzzy","furry","shiny","colorful","fast","slow","loud","quiet","yummy","sweet","fluffy","tall","short","bright","cold","warm","round"], extraWordsBonus:4},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 2 sentences","Uses a describing word (big, soft, yummy...) or extra detail","Uses different words (not just repeating one)"],
          hints:["What does it look like?","What does it feel like?","What sound does it make?"],
          prompts:[
            { text:"Write two or three sentences describing your favorite animal. What does it look like? What does it do?", exemplar:"My favorite animal is a panda. It is big and fuzzy. It likes to eat bamboo." },
            { text:"Write two or three sentences describing your favorite food. What does it look like or taste like?", exemplar:"My favorite food is pizza. It is round and cheesy. It tastes so yummy." },
            { text:"Write two or three sentences describing your favorite toy. What does it look like?", exemplar:"My favorite toy is my teddy bear. It is soft and brown. It has a red bow." }
          ] },
        { reps:3, scaffoldType:'checklist-only',
          target:{minWords:16, minSentences:4, traitWords:[]},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 4 sentences","Stays on topic (tells about one event)","Uses different words (not just repeating one)"],
          hints:["Where were you?","Who was with you?","How did it end?"],
          prompts:[
            { text:"Write four sentences about a fun day you had. What did you do? How did you feel?", exemplar:"Last weekend I went to the zoo. I saw a big lion. I also saw monkeys playing. It was a great day." },
            { text:"Write four sentences about a trip or outing you went on.", exemplar:"I went to my cousin's house. We played games together. We ate ice cream after lunch. I had so much fun." },
            { text:"Write four sentences about a time you helped someone.", exemplar:"I helped my mom clean the kitchen. I washed the dishes. She thanked me for helping. I felt proud." }
          ] },
        { reps:3, scaffoldType:'checklist-only',
          target:{minWords:16, minSentences:4, traitWords:["first","next","then","after that","finally"], extraWordsBonus:4},
          checklist:["Starts with a capital letter","Ends with a period, ! or ?","Has at least 4 sentences","Uses a linking word (First, Next, Then, Finally...)","Uses different words (not just repeating one)"],
          hints:["What do you do right when you wake up?","What comes after that?","What do you do last?"],
          prompts:[
            { text:"Write about your morning routine. Use words like First, Next, and Then.", exemplar:"First, I wake up and brush my teeth. Next, I get dressed. Then I eat breakfast. Finally, I go to school." },
            { text:"Write about how you get ready for bed. Use words like First, Next, and Then.", exemplar:"First, I put on my pajamas. Next, I brush my teeth. Then I read a book. Finally, I go to sleep." },
            { text:"Write about how you play your favorite game, step by step.", exemplar:"First, I get the ball. Next, I find a friend to play with. Then we take turns. Finally, we count who won." }
          ] },

    [ {q:"An emotional appeal tries to make the reader...", opts:["Feel something about the issue","Fall asleep","Forget the topic","Disagree with you"], a:0},
      {q:"Which phrase is an emotional appeal?", opts:["Recess happens at school.","Imagine how happy every student would feel.","The end.","Recess is a break."], a:1} ],
    [ {q:"Acknowledging another view means...", opts:["Agreeing you were wrong","Mentioning what someone who disagrees might think","Ignoring the topic","Ending the piece"], a:1},
      {q:"Which word often introduces a counter-argument?", opts:["Also","However","First","Finally"], a:1} ],
    [ {q:"A call to action tells the reader to...", opts:["Ignore the issue","Actually do something about the issue","Forget the position","Ask more questions"], a:1},
      {q:"Which phrase is a call to action?", opts:["Once upon a time","So please, let's make this change today.","Recess is a word.","The end."], a:1} ]
  ]
};

// ── STATE ──
let state = { grade:null, unitKey:null, levelIdx:0, promptIdx:0, repsDone:0, usedPrompts:[], teacherMode:false, attempts:[], progress:{}, rehearsed:false, scribed:false, draftText:'', phase:'practice', stories:{}, studentId:null, studentName:'', log:[] };
function unitProgress(){ state.progress[state.unitKey] = state.progress[state.unitKey] || 1; return state.progress[state.unitKey]; }
function currentLevel(){ return DATA[state.grade].units[state.unitKey].levels[state.levelIdx]; }
function currentPrompt(){ return currentLevel().prompts[state.promptIdx]; }
function currentUnit(){ return DATA[state.grade].units[state.unitKey]; }
function getStory(unitKey){
  if(!state.stories[unitKey]) state.stories[unitKey] = { topic:'', parts:[] };
  return state.stories[unitKey];
}
function logSubmission(entry){
  state.log.push(entry);
}
function pickPromptIndex(lvl){
  if(!state.usedPrompts.length && lvl.prompts.length){ /* first pick handled by caller resetting */ }
  let avail = lvl.prompts.map((_,i)=>i).filter(i=>!state.usedPrompts.includes(i));
  if(avail.length===0){ state.usedPrompts=[]; avail=lvl.prompts.map((_,i)=>i); }
  const idx = avail[Math.floor(Math.random()*avail.length)];
  state.usedPrompts.push(idx);
  return idx;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── STUDENT PROFILES + PERSISTENCE (best-effort; app works fine without it) ──
// Each student's progress, stories, and submission log are stored under their own key,
// so multiple kids can share one device without overwriting each other's work.
const STUDENTS_KEY='writingWorkshopStudents';
function studentDataKey(id){ return 'writingWorkshopStudentData_'+id; }

function getStudents(){
  try{ const raw=localStorage.getItem(STUDENTS_KEY); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}
function saveStudents(list){
  try{ localStorage.setItem(STUDENTS_KEY, JSON.stringify(list)); }catch(e){ /* best-effort */ }
}
function addStudent(name){
  const id = 's_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const list = getStudents();
  list.push({id, name});
  saveStudents(list);
  return id;
}
function removeStudent(id){
  const list = getStudents().filter(s=>s.id!==id);
  saveStudents(list);
  try{ localStorage.removeItem(studentDataKey(id)); }catch(e){}
}

function saveState(){
  if(!state.studentId) return; // no active student profile — nothing to save to
  try{
    localStorage.setItem(studentDataKey(state.studentId), JSON.stringify({
      progress: state.progress, attempts: state.attempts,
      grade: state.grade, unitKey: state.unitKey, levelIdx: state.levelIdx,
      promptIdx: state.promptIdx, repsDone: state.repsDone, usedPrompts: state.usedPrompts,
      draftText: state.draftText, phase: state.phase, stories: state.stories, log: state.log
    }));
  }catch(e){ /* storage unavailable — continue with in-memory state only */ }
}
function loadStudentData(id){
  try{ const raw=localStorage.getItem(studentDataKey(id)); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function clearSavedState(){
  if(!state.studentId) return;
  try{ localStorage.removeItem(studentDataKey(state.studentId)); }catch(e){}
}

let draftSaveTimer=null;
function scheduleDraftSave(){
  state.draftText = document.getElementById('writing-input').value;
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(saveState, 600);
}

// ── TEACHER TOGGLE / STREAK ──
function toggleTeacher(){
  state.teacherMode=!state.teacherMode;
  document.getElementById('teacher-toggle').classList.toggle('active',state.teacherMode);
  render();
}
function renderStreak(){
  const passes = state.attempts.filter(Boolean).length;
  document.getElementById('streak-val').textContent = '🔥 ' + passes;
  const last8 = state.attempts.slice(-8);
  document.getElementById('streak-dots').innerHTML = last8.map(a=>`<div class="s-dot ${a?'on':'off'}"></div>`).join('') || '<div class="s-dot"></div>';
  renderStudentBadge();
}

function renderStudentBadge(){
  const badge=document.getElementById('student-badge');
  if(!state.studentId){ badge.style.display='none'; badge.innerHTML=''; return; }
  badge.style.display='block';
  badge.innerHTML=`<span class="pill pill-purple">🧑‍🎓 ${esc(state.studentName)}</span>
    <button class="back-btn" style="font-size:.65rem;padding:4px 10px;margin-left:4px;" onclick="renderStudentPicker()">🔁 Switch</button>
    <button class="back-btn" style="font-size:.65rem;padding:4px 10px;margin-left:4px;" onclick="renderLogScreen()">📋 Log</button>`;
}

// ── SCREENS ──
function showGradePicker(){
  state.grade=null; state.unitKey=null;
  document.getElementById('breadcrumb').textContent='Pick a grade to start';
  const app=document.getElementById('app');
  document.getElementById('quiz-area').innerHTML='';
  let html=`<div class="card slide-up"><h2>Choose a Grade</h2><div class="grid">`;
  [1,2,3].forEach(g=>{
    const d=DATA[g];
    if(d.comingSoon){
      html+=`<div class="pick-card locked"><div class="pick-icon">🔒</div><div><div class="title">${d.label}</div><div class="sub">Coming soon</div></div></div>`;
    } else {
      html+=`<button class="pick-card" onclick="showUnitPicker(${g})" style="border:none;width:100%;"><div class="pick-icon">📝</div><div><div class="title">${d.label}</div><div class="sub">${d.sub}</div></div></button>`;
    }
  });
  html+=`</div></div>`;
  app.innerHTML=html;
}

function showResumeBanner(saved){
  document.getElementById('breadcrumb').textContent=`Welcome back, ${state.studentName}!`;
  const app=document.getElementById('app');
  document.getElementById('quiz-area').innerHTML='';
  const gradeInfo = DATA[saved.grade];
  const gradeLabel = gradeInfo ? gradeInfo.label : 'Grade '+saved.grade;
  const unit = gradeInfo && gradeInfo.units[saved.unitKey];
  const unitLabel = unit ? unit.title : saved.unitKey;
  app.innerHTML = `<div class="card slide-up" style="text-align:center;">
    <h2>👋 Welcome Back, ${esc(state.studentName)}!</h2>
    <p style="font-weight:700;color:var(--muted);margin-bottom:18px;">You were on <strong>${esc(gradeLabel)} · ${esc(unitLabel)} · Level ${(saved.levelIdx||0)+1}</strong>.</p>
    <div class="action-row">
      <button class="btn btn-green btn-lg" onclick="resumeSavedState()">▶️ Continue Where I Left Off</button>
      <button class="btn btn-ghost" onclick="resetCurrentStudentProgress()">🔄 Start Fresh</button>
    </div>
  </div>`;
}

function resumeSavedState(){
  const saved=loadStudentData(state.studentId);
  if(!saved || !saved.grade || !saved.unitKey){ showGradePicker(); return; }
  state.progress = saved.progress || {};
  state.attempts = saved.attempts || [];
  state.grade = saved.grade;
  state.unitKey = saved.unitKey;
  state.levelIdx = saved.levelIdx || 0;
  state.promptIdx = saved.promptIdx || 0;
  state.repsDone = saved.repsDone || 0;
  state.usedPrompts = saved.usedPrompts || [];
  state.draftText = saved.draftText || '';
  state.phase = saved.phase || 'practice';
  state.stories = saved.stories || {};
  state.log = saved.log || [];
  renderStreak();
  renderWriteScreen();
}

// Resets the CURRENT student's saved progress/log/stories, but keeps them logged in —
// this is "I want to start over," not "forget this student ever existed."
function resetCurrentStudentProgress(){
  clearSavedState();
  const id=state.studentId, name=state.studentName, teacherMode=state.teacherMode;
  state = { grade:null, unitKey:null, levelIdx:0, promptIdx:0, repsDone:0, usedPrompts:[], teacherMode, attempts:[], progress:{}, rehearsed:false, scribed:false, draftText:'', phase:'practice', stories:{}, studentId:id, studentName:name, log:[] };
  renderStreak();
  showGradePicker();
}

// ── STUDENT PROFILES ──
function renderStudentPicker(){
  state.studentId=null; state.studentName='';
  document.getElementById('breadcrumb').textContent="Who's writing today?";
  document.getElementById('quiz-area').innerHTML='';
  const students=getStudents();
  let html=`<div class="card slide-up"><h2>👋 Who's Writing Today?</h2>`;
  if(students.length){
    html+=`<div class="grid">`;
    students.forEach(s=>{
      html+=`<div style="display:flex;gap:8px;">
        <button class="pick-card" style="border:none;flex:1;" onclick='selectStudent(${JSON.stringify(s.id)})'><div class="pick-icon">🧑‍🎓</div><div><div class="title">${esc(s.name)}</div></div></button>
        <button class="back-btn" style="font-size:.75rem;" onclick='confirmRemoveStudent(${JSON.stringify(s.id)}, ${JSON.stringify(s.name)})' title="Remove ${esc(s.name)}">✕</button>
      </div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<p style="font-weight:700;color:var(--muted);margin-bottom:16px;">No students yet — add one below to get started!</p>`;
  }
  html+=`<div style="margin-top:18px;">
    <div class="starter-lbl" style="margin-bottom:6px;">Add a New Student</div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="new-student-name" placeholder="Student's first name" style="flex:1;padding:11px 14px;border:2px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;" onkeydown="if(event.key==='Enter'){submitNewStudent();}">
      <button class="btn btn-green" onclick="submitNewStudent()">+ Add</button>
    </div>
  </div>
  </div>`;
  document.getElementById('app').innerHTML=html;
  renderStreak();
}

function submitNewStudent(){
  const input=document.getElementById('new-student-name');
  const name=input.value.trim();
  if(!name) return;
  const id=addStudent(name);
  selectStudent(id);
}

function confirmRemoveStudent(id, name){
  if(window.confirm && !window.confirm(`Remove ${name} and all of their saved progress? This cannot be undone.`)) return;
  removeStudent(id);
  renderStudentPicker();
}

function selectStudent(id){
  const found=getStudents().find(s=>s.id===id);
  if(!found){ renderStudentPicker(); return; }
  const teacherMode=state.teacherMode;
  state.studentId=id;
  state.studentName=found.name;
  state.teacherMode=teacherMode;
  const saved=loadStudentData(id);
  if(saved && saved.grade && saved.unitKey){
    state.log = saved.log || [];
    state.attempts = saved.attempts || [];
    showResumeBanner(saved);
  } else {
    state.progress={}; state.attempts=[]; state.grade=null; state.unitKey=null; state.levelIdx=0;
    state.promptIdx=0; state.repsDone=0; state.usedPrompts=[]; state.draftText=''; state.phase='practice';
    state.stories={}; state.log=[];
    renderStreak();
    showGradePicker();
  }
}

function initApp(){
  renderStudentPicker();
}

function showUnitPicker(g){
  state.grade=g; state.unitKey=null;
  document.getElementById('breadcrumb').textContent=`${DATA[g].label} · Pick a unit`;
  const app=document.getElementById('app');
  let html=`<div class="card slide-up"><button class="back-btn" onclick="showGradePicker()" style="margin-bottom:14px;">← Grades</button><h2>Choose a Unit</h2><div class="grid">`;
  Object.entries(DATA[g].units).forEach(([key,u])=>{
    if(u.available){
      html+=`<button class="pick-card" onclick="showLevelPicker('${key}')" style="border:none;width:100%;"><div class="pick-icon">${u.icon}</div><div><div class="title">${u.title}</div><div class="sub">${u.sub}</div></div></button>`;
    } else {
      html+=`<div class="pick-card locked"><div class="pick-icon">🔒</div><div><div class="title">${u.title}</div><div class="sub">${u.sub}</div></div></div>`;
    }
  });
  html+=`</div></div>`;
  app.innerHTML=html;
}

function showLevelPicker(key){
  state.unitKey=key;
  const unit=DATA[state.grade].units[key];
  const unlocked=unitProgress();
  document.getElementById('breadcrumb').textContent=`${DATA[state.grade].label} · ${unit.title}`;
  const app=document.getElementById('app');
  document.getElementById('quiz-area').innerHTML='';
  let html=`<div class="card slide-up"><button class="back-btn" onclick="showUnitPicker(${state.grade})" style="margin-bottom:14px;">← Units</button><h2>${unit.icon} ${unit.title}</h2><div class="level-grid">`;
  unit.levels.forEach((lvl,i)=>{
    const n=i+1;
    const locked = n>unlocked;
    html+=`<button class="lvl-btn" ${locked?'disabled':''} onclick="startLevel(${i})">${locked?'🔒':n}<span class="reps-tag">${lvl.reps}×</span></button>`;
  });
  html+=`</div>`;
  if(state.teacherMode){
    html+=`<div class="tip-box" style="margin-top:16px;"><div class="tip-title">👩‍🏫 Teacher Note</div>Level ${unlocked} is next. Each level needs several successful sentences (shown as "3×" etc.) with different prompts before it unlocks the next level — this builds repetition into mastery instead of a single lucky pass.</div>`;
  }
  html+=`</div>`;
  app.innerHTML=html;
}

function startLevel(i){
  state.levelIdx=i;
  state.repsDone=0;
  state.usedPrompts=[];
  state.draftText='';
  state.phase='practice';
  const lvl=currentLevel();
  state.promptIdx=pickPromptIndex(lvl);
  saveState();
  renderWriteScreen();
}

function nextRep(){
  state.draftText='';
  const lvl=currentLevel();
  state.promptIdx=pickPromptIndex(lvl);
  saveState();
  renderWriteScreen();
}

function retrySamePrompt(){
  // draftText intentionally preserved so a failed attempt can be edited, not retyped from scratch
  renderWriteScreen();
}

// Dispatches to the right screen based on where the student is: normal skill-practice reps,
// the one-time topic picker before a story-mode unit's first addition, or the story-building
// step itself (add one piece to an ongoing story). Non-story-mode units (Sentences About Me,
// Labels & Lists) never leave 'practice', so they render exactly as before.
function renderWriteScreen(){
  const unit=currentUnit();
  if(unit.storyMode && state.phase==='story'){
    const lvl=currentLevel();
    const story=getStory(state.unitKey);
    if(state.levelIdx===0 && !story.topic){
      renderTopicPicker();
      return;
    }
    renderStoryScreen();
    return;
  }
  renderPracticeScreen();
}

function renderPracticeScreen(){
  state.rehearsed=false;
  state.scribed=false;
  const unit=DATA[state.grade].units[state.unitKey];
  const lvl=currentLevel();
  const prompt=currentPrompt();
  document.getElementById('breadcrumb').textContent=`${DATA[state.grade].label} · ${unit.title} · Level ${state.levelIdx+1}`;
  const app=document.getElementById('app');
  document.getElementById('quiz-area').innerHTML='';
  let scaffoldHtml='';
  if(lvl.scaffoldType==='wordbank-starter'){
    scaffoldHtml+=`<div class="starter-box"><div class="starter-lbl">Sentence Starter</div>${esc(prompt.starter)}</div>`;
    scaffoldHtml+=`<div class="wordbank">${prompt.wordBank.map(w=>`<span class="wb-chip">${esc(w)}</span>`).join('')}</div>`;
  } else if(lvl.scaffoldType==='starter'){
    scaffoldHtml+=`<div class="starter-box"><div class="starter-lbl">Sentence Starter</div>${esc(prompt.starter)}</div>`;
  } else if(lvl.scaffoldType==='emoji-wordbank'){
    scaffoldHtml+=`<div style="text-align:center;font-size:4.5rem;line-height:1;margin-bottom:12px;">${prompt.emoji}</div>`;
    scaffoldHtml+=`<div class="wordbank" style="justify-content:center;">${prompt.wordBank.map(w=>`<span class="wb-chip">${esc(w)}</span>`).join('')}</div>`;
  } else if(lvl.scaffoldType==='list'){
    scaffoldHtml+=`<div class="starter-box"><div class="starter-lbl">How to Write Your List</div>Write one item on each line. Press Enter after each one!</div>`;
    scaffoldHtml+=`<div class="checklist-side"><div class="checklist-side-title">Writing Checklist</div><ul>${lvl.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  } else {
    scaffoldHtml+=`<div class="checklist-side"><div class="checklist-side-title">Writing Checklist</div><ul>${lvl.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  }
  let exemplarHtml='';
  if(state.teacherMode){
    exemplarHtml=`<div class="exemplar-box"><div class="exemplar-lbl">👩‍🏫 Exemplar (Teacher Mode)</div>${esc(prompt.exemplar)}</div>`;
  } else {
    exemplarHtml=`<button class="btn btn-ghost" id="example-btn" onclick="toggleExample()" style="margin-top:10px;">💡 Show Me an Example</button>
      <div class="exemplar-box" id="example-box" style="display:none;margin-top:10px;"><div class="exemplar-lbl">💡 Example</div>${esc(prompt.exemplar)}</div>`;
  }
  const repDotsHtml = Array.from({length:lvl.reps}).map((_,ri)=>{
    const cls = ri<state.repsDone ? 'done' : (ri===state.repsDone ? 'current' : '');
    return `<div class="rep-dot ${cls}"></div>`;
  }).join('');
  const unitNoun = lvl.mode==='label' ? 'Label' : (lvl.mode==='list' ? 'List' : 'Sentence');
  const draftPlaceholder = lvl.mode==='label' ? 'Type your label here...' : (lvl.mode==='list' ? 'Item 1\nItem 2\nItem 3...' : 'Say it out loud first, then type it here...');
  const html=`<div class="card slide-up">
    <div class="write-top">
      <button class="back-btn" onclick="showLevelPicker('${state.unitKey}')">← Levels</button>
      <div class="pills"><span class="pill pill-coral">Level ${state.levelIdx+1}</span> <span class="pill pill-sky">${unit.title}</span> <span class="pill pill-purple">${unitNoun} ${state.repsDone+1} of ${lvl.reps}</span></div>
    </div>
    <div class="rep-dots">${repDotsHtml}</div>
    <div class="prompt-box">
      <div class="prompt-title">Your Writing Prompt</div>
      <div class="prompt-text">${esc(prompt.text)}</div>
      ${exemplarHtml}
    </div>
    ${scaffoldHtml}
    <div class="rehearsal-box" id="rehearsal-box">
      <div class="rehearsal-title">🗣️ Tip: Say It Before You Write It</div>
      <div class="rehearsal-sub">Saying your answer out loud first can help you think it through.</div>
      <div class="rehearsal-btns">
        <button class="btn btn-ghost" onclick="speakPrompt()">🔊 Hear the Prompt</button>
      </div>
      <div class="scribe-row"><label><input type="checkbox" id="scribe-check" onchange="state.scribed=this.checked"> ✍️ An adult is typing this for me</label></div>
    </div>
    <textarea id="writing-input" placeholder="${esc(draftPlaceholder)}" oninput="updateWordCount();scheduleDraftSave();">${esc(state.draftText||'')}</textarea>
    <div class="word-count" id="word-count">${(state.draftText||'').trim()?state.draftText.trim().split(/\s+/).filter(Boolean).length:0} words</div>
    <div class="action-row">
      <button class="btn btn-coral btn-lg" id="check-btn" onclick="submitWriting()">✓ Check My Writing</button>
      <button class="btn btn-ghost" onclick="speakMyWriting()">🔊 Read It Back To Me</button>
      <button class="btn btn-ghost" onclick="printLevel()">🖨️ Print</button>
    </div>
  </div>`;
  app.innerHTML=html;
}

// Called once, right after Level 1's practice reps are mastered for a story-mode unit,
// to let the student pick (or write their own) topic for the story they'll build across
// every remaining level.
function renderTopicPicker(){
  const unit=currentUnit();
  const lvl=currentLevel();
  document.getElementById('breadcrumb').textContent=`${DATA[state.grade].label} · ${unit.title} · Choose Your Story`;
  document.getElementById('quiz-area').innerHTML='';
  const starters=lvl.storyStarters||[];
  const html=`<div class="card slide-up">
    <h2>📖 What will YOUR story be about?</h2>
    <p style="font-weight:700;color:var(--muted);margin-bottom:16px;">Pick an idea to start with, or write your own. You'll build this story one piece at a time as you go through the levels.</p>
    <div class="grid">
      ${starters.map((s,i)=>{
        const isOwn=s.toLowerCase().includes('my own');

        return `<button class="pick-card" style="border:none;width:100%;" onclick="${esc(jsCall)}"><div class="pick-icon">${isOwn?'✏️':'📖'}</div><div><div class="title">${esc(s)}</div></div></button>`;
      }).join('')}
    </div>
    <div id="own-topic-box" style="display:none;margin-top:14px;">
      <textarea id="own-topic-input" placeholder="Type your own story idea here (a sentence or two about what it'll be about)..." style="min-height:70px;"></textarea>
      <button class="btn btn-sky" style="margin-top:8px;width:100%;" onclick="confirmOwnTopic()">✓ Use This Idea</button>
    </div>
  </div>`;
  document.getElementById('app').innerHTML=html;
}

function showOwnTopicInput(){
  document.getElementById('own-topic-box').style.display='block';
  document.getElementById('own-topic-input').focus();
}

function confirmOwnTopic(){
  const val=document.getElementById('own-topic-input').value.trim();
  if(!val) return;
  chooseStoryTopic(val);
}

function chooseStoryTopic(topic){
  const story=getStory(state.unitKey);
  story.topic=topic;
  saveState();
  renderWriteScreen();
}

// Called from the results screen once a level's practice reps are fully mastered — moves
// the student from isolated skill practice into adding a real piece to their own story.
function goToStoryStep(){
  state.phase='story';
  state.draftText='';
  saveState();
  renderWriteScreen();
}

function renderStoryScreen(){
  const unit=currentUnit();
  const lvl=currentLevel();
  const story=getStory(state.unitKey);
  document.getElementById('breadcrumb').textContent=`${DATA[state.grade].label} · ${unit.title} · Building Your Story`;
  document.getElementById('quiz-area').innerHTML='';
  const storySoFarHtml = story.parts.length
    ? story.parts.map(esc).join(' ')
    : '<em style="color:#94a3b8;">This is the very start of your story!</em>';
  let exemplarHtml='';
  const examplePrompt=currentPrompt();
  if(state.teacherMode){
    exemplarHtml=`<div class="exemplar-box"><div class="exemplar-lbl">👩‍🏫 Example (Teacher Mode)</div>${esc(examplePrompt.exemplar)}</div>`;
  } else {
    exemplarHtml=`<button class="btn btn-ghost" id="example-btn" onclick="toggleExample()" style="margin-top:10px;">💡 Show Me an Example</button>
      <div class="exemplar-box" id="example-box" style="display:none;margin-top:10px;"><div class="exemplar-lbl">💡 Example</div>${esc(examplePrompt.exemplar)}</div>`;
  }
  const html=`<div class="card slide-up">
    <div class="write-top">
      <button class="back-btn" onclick="showLevelPicker('${state.unitKey}')">← Levels</button>

// ── EVALUATION ──
const STOPWORDS=new Set(['a','an','the','is','it','was','were','are','to','of','and','in','on','my','i','me','so']);
function hasWordVariety(words){
  const content=words.map(w=>w.toLowerCase().replace(/[^a-z']/g,'')).filter(w=>w && !STOPWORDS.has(w));
  if(content.length<3) return true;
  const freq={};
  content.forEach(w=>freq[w]=(freq[w]||0)+1);
  const maxCount=Math.max(...Object.values(freq));
  return (maxCount/content.length) <= 0.5;
}
// A trait word only counts if there's real content after it — not just the bare word tacked
// onto the end ("I like pizza because."). This is the main defense against a student learning
// to game the checklist by appending a connector word without actually using it. Label mode is
// deliberately excluded — labels are only 1-4 words by design, so requiring words *after* the
// trait word there would unfairly fail perfectly good short answers like "soft blanket".
function hasKeywordWithFollowthrough(text, traitWords, minFollow){
  minFollow = minFollow || 2;
  const lower=text.toLowerCase();
  return traitWords.some(w=>{
    const wLower=w.toLowerCase();
    const idx=lower.indexOf(wLower);
    if(idx===-1) return false;
    const after=text.slice(idx+w.length);
    const afterWords=after.split(/\s+/).filter(Boolean).filter(tok=>/[a-zA-Z]/.test(tok));
    return afterWords.length>=minFollow;
  });
}

function evaluateSentence(text, lvl){
  const trimmed=text.trim();
  const sentences=trimmed.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const words=trimmed.split(/\s+/).filter(Boolean);
  const capitalOk=/^[A-Z]/.test(trimmed);
  const endOk=/[.!?]\s*$/.test(trimmed);
  const wordOk=words.length>=lvl.target.minWords;
  const sentOk=sentences.length>=lvl.target.minSentences;
  let ci=0;
  const results=[
    {key:'capital', label:lvl.checklist[ci++], pass:capitalOk},
    {key:'end', label:lvl.checklist[ci++], pass:endOk},
    {key:'length', label:lvl.checklist[ci++], pass:(lvl.target.minSentences>1?sentOk:wordOk)}
  ];
  let traitOk=true, hasKeyword=false;
  if(lvl.target.traitWords && lvl.target.traitWords.length){
    hasKeyword=hasKeywordWithFollowthrough(trimmed, lvl.target.traitWords, 2);
    const bonus=lvl.target.extraWordsBonus||4;
    traitOk = hasKeyword || words.length >= (lvl.target.minWords + bonus);
    results.push({key:'trait', label:lvl.checklist[ci++], pass:traitOk});
  } else {
    // No auto-checkable keyword for this level (e.g. "Introduces a character," "Stays on
    // topic"). Can't verify that programmatically, so it's shown but never counted against
    // the student — the key thing this fixes is keeping checklist array positions aligned
    // with results, so the variety check below never inherits the wrong label.
    results.push({key:'topic', label:lvl.checklist[ci++], pass:true});
  }
  const varietyOk=hasWordVariety(words);
  results.push({key:'variety', label:lvl.checklist[ci++], pass:varietyOk});
  return {results, capitalOk, endOk, hasKeyword, words, sentences, mode:'sentence'};
}

function evaluateLabel(text, lvl){
  const trimmed=text.trim();
  const words=trimmed.split(/\s+/).filter(Boolean);
  const minW=lvl.target.minWords, maxW=lvl.target.maxWords||(minW+2);
  let ci=0;
  const results=[
    {key:'nonempty', label:lvl.checklist[ci++], pass: words.length>=1},
    {key:'lengthRange', label:lvl.checklist[ci++], pass: words.length>=minW && words.length<=maxW}
  ];
  let hasKeyword=false;
  if(lvl.target.traitWords && lvl.target.traitWords.length){
    const lower=trimmed.toLowerCase();
    hasKeyword=lvl.target.traitWords.some(w=>lower.includes(w.toLowerCase()));
    results.push({key:'trait', label:lvl.checklist[ci++], pass:hasKeyword});
  }
  return {results, words, hasKeyword, mode:'label'};
}

// Splits list-mode text into items. Newlines are the primary separator (what students are
// taught to use). Commas are only treated as separators when there are NO newlines at all —
// otherwise a normal sentence-style item like "First, get bread" gets wrongly split in two.
function splitListItems(text){
  const trimmed=text.trim();
  if(!trimmed) return [];
  const hasNewline=/\n/.test(trimmed);
  const raw = hasNewline ? trimmed.split(/\n+/) : trimmed.split(/,/);
  return raw.map(s=>s.trim()).filter(Boolean);
}

function evaluateList(text, lvl){
  const items=splitListItems(text);
  const minItems=lvl.target.minItems;
  const itemMaxWords=lvl.target.itemMaxWords||6;
  let ci=0;
  const results=[
    {key:'itemCount', label:lvl.checklist[ci++], pass: items.length>=minItems},
    {key:'eachHasContent', label:lvl.checklist[ci++], pass: items.length>0 && items.every(it=>{const w=it.split(/\s+/).filter(Boolean).length; return w>=1 && w<=itemMaxWords;})}
  ];
  let hasKeyword=false;
  if(lvl.target.traitWords && lvl.target.traitWords.length){
    hasKeyword=hasKeywordWithFollowthrough(items.join(' '), lvl.target.traitWords, 2);
    results.push({key:'trait', label:lvl.checklist[ci++], pass:hasKeyword});
  }
  const allWords=items.join(' ').split(/\s+/).filter(Boolean);
  const varietyOk=hasWordVariety(allWords);
  results.push({key:'variety', label:lvl.checklist[ci++], pass:varietyOk});
  return {results, items, hasKeyword, mode:'list'};
}

function evaluate(text, lvl){
  if(lvl.mode==='label') return evaluateLabel(text, lvl);
  if(lvl.mode==='list') return evaluateList(text, lvl);
  return evaluateSentence(text, lvl);
}

function annotateSentence(text, lvl, capitalOk, endOk){
  const chars=text.split('');
  const classes=new Array(chars.length).fill(null);
  if(chars.length) classes[0]=capitalOk?'ok':'bad';
  let li=chars.length-1;
  while(li>=0 && /\s/.test(chars[li])) li--;
  if(li>=0) classes[li]=endOk?'ok':'bad';
  if(lvl.target.traitWords){
    lvl.target.traitWords.forEach(w=>{
      const re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig');
      let m;
      while((m=re.exec(text))){
        for(let i=m.index;i<m.index+m[0].length;i++){ if(classes[i]==null) classes[i]='trait'; }
      }
    });
  }
  let html='',curCls=null,buf='';
  function flush(){ if(!buf) return; html+= curCls? `<span class="mk-${curCls}">${esc(buf)}</span>` : esc(buf); buf=''; }
  for(let i=0;i<chars.length;i++){ if(classes[i]!==curCls){flush();curCls=classes[i];} buf+=chars[i]; }
  flush();
  return html||'<em style="color:#94a3b8;">(nothing written yet)</em>';
}

function annotateLabel(text, ev){
  const t=text.trim();
  if(!t) return '<em style="color:#94a3b8;">(nothing written yet)</em>';
  const lengthResult = ev.results.find(r=>r.key==='lengthRange');
  const cls = (lengthResult && lengthResult.pass) ? 'mk-ok' : 'mk-bad';
  return `<span class="${cls}">${esc(t)}</span>`;
}

function annotateList(text, lvl){
  const items=splitListItems(text);
  if(!items.length) return '<em style="color:#94a3b8;">(nothing written yet)</em>';
  const itemMaxWords=lvl.target.itemMaxWords||6;
  return items.map(it=>{
    const w=it.split(/\s+/).filter(Boolean).length;
    const cls = (w>=1 && w<=itemMaxWords) ? 'mk-ok' : 'mk-bad';
    return `• <span class="${cls}">${esc(it)}</span>`;
  }).join('<br>');
}

function annotate(text, lvl, ev){
  if(lvl.mode==='label') return annotateLabel(text, ev);
  if(lvl.mode==='list') return annotateList(text, lvl);
  return annotateSentence(text, lvl, ev.capitalOk, ev.endOk);
}

let lastEval=null;

const CRITICAL_KEYS = new Set(['length','lengthRange','itemCount','eachHasContent','nonempty']);
function submitWriting(){
  if(state.phase==='story'){ submitStoryWriting(); return; }
  submitPracticeWriting();
}

function submitPracticeWriting(){
  const text=document.getElementById('writing-input').value;
  state.draftText=text;
  const lvl=currentLevel();
  const unit=currentUnit();
  const ev=evaluate(text, lvl);
  const passCount=ev.results.filter(r=>r.pass).length;
  const total=ev.results.length;
  // Structural minimums (word/item count, non-empty) must always be met — they define the
  // level's actual requirement. Refinement checks (capitalization, variety, reason words) stay
  // on the forgiving 60%-of-checklist bar so a mostly-right attempt still passes.
  const criticalOk = ev.results.filter(r=>CRITICAL_KEYS.has(r.key)).every(r=>r.pass);
  const passed = criticalOk && (passCount >= Math.ceil(total*0.6));
  state.attempts.push(passed);
  let levelMastered=false;
  if(passed){
    state.repsDone++;
    state.draftText='';
    if(state.repsDone >= lvl.reps){
      levelMastered=true;
      // Story-mode units don't unlock the next level yet — the student still needs to add
      // this skill to their real story first. Non-story units unlock immediately, as before.
      if(!unit.storyMode){
        const unlocked=unitProgress();
        if(state.levelIdx+1 >= unlocked) state.progress[state.unitKey]=state.levelIdx+2;
      }
    }
  }
  lastEval = {phase:'practice', text, lvl, ev, passed, levelMastered, scribed:state.scribed, repsDoneAtSubmit:state.repsDone};
  logSubmission({ts:Date.now(), unitKey:state.unitKey, unitTitle:unit.title, levelIdx:state.levelIdx, phase:'practice', text, passed, passCount, total});
  saveState();
  renderStreak();
  renderResults();
}

// Story mode's target/checklist are lighter than the practice versions (adding one piece,
// not writing the whole skill in isolation), so we evaluate against a shim level object
// that swaps in storyTarget/storyChecklist but keeps everything else (mode, scaffoldType).
function submitStoryWriting(){
  const text=document.getElementById('writing-input').value;
  state.draftText=text;
  const lvl=currentLevel();
  const unit=currentUnit();
  const storyLvl={...lvl, target:lvl.storyTarget, checklist:lvl.storyChecklist};
  const ev=evaluate(text, storyLvl);
  const passCount=ev.results.filter(r=>r.pass).length;
  const total=ev.results.length;
  const criticalOk = ev.results.filter(r=>CRITICAL_KEYS.has(r.key)).every(r=>r.pass);
  const passed = criticalOk && (passCount >= Math.ceil(total*0.6));
  state.attempts.push(passed);
  let unitComplete=false;
  if(passed){
    const story=getStory(state.unitKey);
    story.parts.push(text.trim());
    state.draftText='';
    const unlocked=unitProgress();
    if(state.levelIdx+1 >= unlocked) state.progress[state.unitKey]=state.levelIdx+2;
    if(state.levelIdx+1 >= unit.levels.length) unitComplete=true;
  }
  lastEval = {phase:'story', text, lvl:storyLvl, ev, passed, unitComplete, scribed:state.scribed};
  logSubmission({ts:Date.now(), unitKey:state.unitKey, unitTitle:unit.title, levelIdx:state.levelIdx, phase:'story', text, passed, passCount, total});
  saveState();
  renderStreak();
  renderResults();
}

function renderResults(){
  if(lastEval.phase==='story'){ renderStoryResults(); return; }
  renderPracticeResults();
}

function playSuccessSound(big){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const notes = big ? [523.25,659.25,783.99,1046.50] : [523.25,659.25,783.99]; // C5-E5-G5, plus C6 for a bigger moment
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.value=freq;
      const startTime=ctx.currentTime+i*0.11;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.22, startTime+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime+0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime+0.4);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, (notes.length*0.11+0.6)*1000);
  }catch(e){ /* audio unavailable — celebration still works visually without it */ }
}

function triggerConfetti(big){
  const colors=['#fb7185','#4ade80','#38bdf8','#fbbf24','#a78bfa','#f472b6','#22c55e'];
  const count = big ? 60 : 32;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=(Math.random()*100)+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    const size=(6+Math.random()*6);
    el.style.width=size+'px';
    el.style.height=size+'px';
    el.style.borderRadius=Math.random()<0.5?'50%':'2px';
    const duration=(1.6+Math.random()*1.2);
    el.style.animationDuration=duration+'s';
    el.style.animationDelay=(Math.random()*0.3)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (duration+0.6)*1000);
  }
}

function renderPracticeResults(){
  const {text, lvl, ev, passed, levelMastered, scribed, repsDoneAtSubmit} = lastEval;
  const annotated = annotate(text, lvl, ev);
  const passCount=ev.results.filter(r=>r.pass).length;
  const total=ev.results.length;
  let msg, tip, celebrateHtml='';
  const hint = (lvl.hints && lvl.hints.length) ? lvl.hints[Math.floor(Math.random()*lvl.hints.length)] : "What else could you say?";
  const passLabel = lvl.mode==='label' ? 'label' : (lvl.mode==='list' ? 'list' : 'sentence');
  const nameTag = state.studentName ? `, ${esc(state.studentName)}` : '';
  if(passed){
    const bigClass = levelMastered ? ' big' : '';
    const emoji = levelMastered ? '🏆' : '🎉';
    const sub = levelMastered ? `Level mastered — you scored ${passCount}/${total}!` : `You scored ${passCount}/${total}!`;
    celebrateHtml = `<div class="celebrate-banner${bigClass}">
      <div class="celebrate-emoji">${emoji}</div>
      <div class="celebrate-text">Great job${nameTag}!</div>
      <div class="celebrate-sub">${sub}</div>
    </div>`;
    tip = lvl.mode==='sentence'
      ? `Nice work! Want to make it even stronger next time? Try answering: ${hint}`
      : `Nice work! Next time, try answering: ${hint}`;
  } else {
    msg = "📝 Good try — let's polish it up!";
    const firstMiss = ev.results.find(r=>!r.pass);
    if(firstMiss && firstMiss.key==='capital') tip = "Start your sentence with a CAPITAL letter — like M instead of m.";
    else if(firstMiss && firstMiss.key==='end') tip = "Don't forget to end your sentence with a period (.), question mark (?), or exclamation mark (!).";
    else if(firstMiss && firstMiss.key==='trait' && lvl.mode==='label') tip = `Try adding a describing word! You could answer: ${hint}`;
    else if(firstMiss && firstMiss.key==='trait' && lvl.mode==='list') tip = `Try using an order word like First, Next, Then, or Finally in one of your steps.`;
    else if(firstMiss && firstMiss.key==='trait') tip = `Try telling WHY. You could answer: ${hint}`;
    else if(firstMiss && firstMiss.key==='variety') tip = "Try not to repeat the same word so many times — swap one in for a different word.";
    else if(firstMiss && firstMiss.key==='nonempty') tip = "Don't forget to write something in the box!";
    else if(firstMiss && firstMiss.key==='lengthRange') tip = `Check your word count — a ${passLabel} should have ${lvl.target.minWords}${lvl.target.maxWords?'–'+lvl.target.maxWords:''} words, not more or fewer.`;
    else if(firstMiss && firstMiss.key==='itemCount') tip = `Try adding one more item! You could answer: ${hint}`;
    else if(firstMiss && firstMiss.key==='eachHasContent') tip = `Keep each item short — just a word or short phrase, not a full sentence.`;
    else if(firstMiss) tip = `Add a bit more! Try answering: ${hint}`;
    else tip = "Read it over again — does it look complete?";
  }
  const checkHtml = ev.results.map(r=>`<div class="check-item ${r.pass?'pass':'miss'}">${r.pass?'✓':'✗'} ${esc(r.label)}</div>`).join('');
  const unit=DATA[state.grade].units[state.unitKey];
  const isLastLevel = state.levelIdx+1 >= unit.levels.length;

  let primaryBtn, repLine;
  if(!passed){
    primaryBtn = `<button class="btn btn-coral" onclick="retrySamePrompt()">🔄 Try This One Again</button>`;
    repLine = `Sentence ${repsDoneAtSubmit+1} of ${lvl.reps} for this level — not mastered yet.`;
  } else if(!levelMastered){
    primaryBtn = `<button class="btn btn-sky" onclick="nextRep()">➡️ Next Sentence (${repsDoneAtSubmit+1} of ${lvl.reps} done)</button>`;
    repLine = `${repsDoneAtSubmit} of ${lvl.reps} sentences mastered at this level — keep going!`;
  } else if(unit.storyMode){
    primaryBtn = `<button class="btn btn-purple" onclick="goToStoryStep()">✍️ Add This To My Story</button>`;
    repLine = `Skill practiced! Now let's add it to your real story.`;
  } else if(isLastLevel){
    primaryBtn = `<button class="btn btn-sky" onclick="showLevelPicker('${state.unitKey}')">🏁 Unit Complete!</button>`;
    repLine = `All ${lvl.reps} sentences mastered — and that's the whole unit! 🎉`;
  } else {
    primaryBtn = `<button class="btn btn-sky" onclick="startLevel(${state.levelIdx+1})">🚀 Next Level</button>`;
    repLine = `All ${lvl.reps} sentences mastered at this level — level unlocked!`;
  }

  const app=document.getElementById('app');
  app.innerHTML = `<div class="results-card ${passed?'success':'fail'} slide-up">
    ${celebrateHtml}
    <div class="score-row">
      <div><div class="score-num">${passCount}/${total}</div><div class="score-lbl">Checklist Items Met</div></div>
      <div class="badge ${passed?'s':'f'}">${passed?'PASSED':'TRY AGAIN'}</div>
    </div>
    <div class="rep-progress-line">${repLine}</div>
    ${scribed?'<div style="margin-bottom:10px;"><span class="pill pill-purple">✍️ Adult-scribed — great job dictating your ideas!</span></div>':''}
    ${!passed?`<div style="font-weight:800;font-size:1.05rem;margin-bottom:12px;">${msg}</div>`:''}
    <div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Your Writing</div>
    <div class="annotated-box">${annotated}</div>
    <div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Checklist</div>
    <div class="check-results">${checkHtml}</div>
    <div class="tip-box"><div class="tip-title">💡 Tip</div>${esc(tip)}</div>
    <div class="action-row">
      ${primaryBtn}
      <button class="btn btn-purple" onclick="showQuiz()">📝 Skill Quiz</button>
      <button class="btn btn-ghost" onclick="showLevelPicker('${state.unitKey}')">🎯 Levels</button>
    </div>
  </div>`;
  if(passed){ triggerConfetti(levelMastered); playSuccessSound(levelMastered); }
  document.getElementById('app').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderStoryResults(){
  const {text, lvl, ev, passed, unitComplete, scribed} = lastEval;
  const annotated = annotate(text, lvl, ev);
  const passCount=ev.results.filter(r=>r.pass).length;
  const total=ev.results.length;
  const checkHtml = ev.results.map(r=>`<div class="check-item ${r.pass?'pass':'miss'}">${r.pass?'✓':'✗'} ${esc(r.label)}</div>`).join('');
  const unit=currentUnit();
  const story=getStory(state.unitKey);
  const storySoFarHtml = story.parts.length ? story.parts.map(esc).join(' ') : '<em style="color:#94a3b8;">This is the very start of your story!</em>';

  let msg='', primaryBtn, celebrateHtml='';
  const nameTag = state.studentName ? `, ${esc(state.studentName)}` : '';
  if(!passed){
    msg = "📝 Almost! Let's fix this piece before it joins your story.";
    primaryBtn = `<button class="btn btn-coral" onclick="retrySamePrompt()">🔄 Try This Piece Again</button>`;
  } else if(unitComplete){
    celebrateHtml = `<div class="celebrate-banner big">
      <div class="celebrate-emoji">🎉</div>
      <div class="celebrate-text">Great job${nameTag}!</div>
      <div class="celebrate-sub">Your story is COMPLETE — final score ${passCount}/${total}!</div>
    </div>`;
    primaryBtn = `<button class="btn btn-sky" onclick="renderStoryComplete()">📖 Read My Finished Story</button>`;
  } else {
    celebrateHtml = `<div class="celebrate-banner">
      <div class="celebrate-emoji">✍️</div>
      <div class="celebrate-text">Great job${nameTag}!</div>
      <div class="celebrate-sub">You scored ${passCount}/${total} — added to your story!</div>
    </div>`;
    primaryBtn = `<button class="btn btn-sky" onclick="startLevel(${state.levelIdx+1})">🚀 Next Level</button>`;
  }

  const app=document.getElementById('app');
  app.innerHTML = `<div class="results-card ${passed?'success':'fail'} slide-up">
    ${celebrateHtml}
    <div class="score-row">
      <div><div class="score-num">${passCount}/${total}</div><div class="score-lbl">Checklist Items Met</div></div>
      <div class="badge ${passed?'s':'f'}">${passed?'ADDED':'TRY AGAIN'}</div>
    </div>
    ${scribed?'<div style="margin-bottom:10px;"><span class="pill pill-purple">✍️ Adult-scribed — great job dictating your ideas!</span></div>':''}
    ${!passed?`<div style="font-weight:800;font-size:1.05rem;margin-bottom:12px;">${msg}</div>`:''}
    <div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Your New Piece</div>
    <div class="annotated-box">${annotated}</div>
    ${passed?`<div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Your Whole Story So Far</div><div class="checklist-side" style="background:linear-gradient(135deg,#eff6ff,#f0fdf4);"><div style="font-size:1rem;line-height:1.7;font-weight:700;color:var(--text);">${storySoFarHtml}</div></div>`:''}
    <div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 8px;">Checklist</div>
    <div class="check-results">${checkHtml}</div>
    <div class="action-row">
      ${primaryBtn}
      <button class="btn btn-ghost" onclick="showLevelPicker('${state.unitKey}')">🎯 Levels</button>
    </div>
  </div>`;
  if(passed){ triggerConfetti(unitComplete); playSuccessSound(unitComplete); }
  document.getElementById('app').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderStoryComplete(){
  const unit=currentUnit();
  const story=getStory(state.unitKey);
  document.getElementById('breadcrumb').textContent=`${DATA[state.grade].label} · ${unit.title} · Story Complete!`;
  document.getElementById('quiz-area').innerHTML='';
  const fullText=story.parts.map(esc).join(' ');
  document.getElementById('app').innerHTML=`<div class="card slide-up" style="text-align:center;">
    <h2>🎉 You Wrote a Whole Story!</h2>
    <p style="font-weight:700;color:var(--muted);margin-bottom:16px;">${story.topic?('Based on: '+esc(story.topic)):''}</p>
    <div class="checklist-side" style="background:linear-gradient(135deg,#eff6ff,#f0fdf4);text-align:left;">
      <div style="font-size:1.1rem;line-height:1.8;font-weight:700;color:var(--text);">${fullText}</div>
    </div>
    <div class="action-row" style="margin-top:16px;">
      <button class="btn btn-sky btn-lg" onclick="printMyStory()">🖨️ Print My Story</button>
      <button class="btn btn-ghost" onclick="showLevelPicker('${state.unitKey}')">🎯 Back to Levels</button>
    </div>
  </div>`;
}

function printMyStory(){
  const unit=currentUnit();
  const story=getStory(state.unitKey);
  const w=window.open('','_blank');
  const fullText=story.parts.map(esc).join(' ');
  w.document.write(`<html><head><title>${esc(unit.title)} - My Story</title>
    <style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;line-height:1.9;padding:0 20px;font-size:1.15rem;}
    h1{font-size:1.4rem;} .meta{color:#666;font-size:.85rem;margin-bottom:24px;}</style>
    </head><body>
    <h1>${esc(unit.title)}</h1>
    <p class="meta">${esc(DATA[state.grade].label)} Writing Workshop${story.topic?(' — Based on: '+esc(story.topic)):''}</p>
    <p>${fullText || '<em>(story not finished yet)</em>'}</p>
    <p style="margin-top:40px;color:#999;font-size:.85rem;">Written by: _____________________</p>
    </body></html>`);
  w.document.close();
  w.print();
}

// ── SUBMISSION LOG (teacher-facing review) ──
function renderLogScreen(){
  if(!state.studentId){ renderStudentPicker(); return; }
  document.getElementById('breadcrumb').textContent=`${state.studentName}'s Writing Log`;
  document.getElementById('quiz-area').innerHTML='';
  const entries=[...state.log].reverse();
  let html=`<div class="card slide-up">
    <button class="back-btn" onclick="${state.unitKey?"renderWriteScreen()":"showGradePicker()"}" style="margin-bottom:14px;">← Back</button>
    <h2>📋 ${esc(state.studentName)}'s Writing Log</h2>
    <p style="font-weight:700;color:var(--muted);margin-bottom:16px;">${entries.length} submission${entries.length===1?'':'s'} recorded — includes every attempt, pass or fail.</p>`;
  if(!entries.length){
    html+=`<p style="font-weight:700;color:var(--muted);">Nothing submitted yet.</p>`;
  } else {
    html+=`<div style="display:flex;flex-direction:column;gap:10px;">`;
    entries.forEach(e=>{
      const d=new Date(e.ts);
      const dateStr=isNaN(d.getTime())?'':d.toLocaleString();
      const phaseLbl = e.phase==='story' ? '✍️ Story Step' : '📝 Practice';
      html+=`<div class="checklist-side" style="margin-bottom:0;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;">
          <div><span class="pill pill-sky">${esc(e.unitTitle||e.unitKey)}</span> <span class="pill pill-coral">Level ${(e.levelIdx||0)+1}</span> <span class="pill pill-purple">${phaseLbl}</span></div>
          <div class="badge ${e.passed?'s':'f'}" style="padding:4px 12px;font-size:.75rem;">${e.passed?'PASSED':'TRY AGAIN'} (${e.passCount}/${e.total})</div>
        </div>
        <div style="font-weight:700;color:var(--text);margin-bottom:4px;">${esc(e.text) || '<em style="color:#94a3b8;">(empty)</em>'}</div>
        <div style="font-size:.7rem;font-weight:800;color:var(--muted);">${esc(dateStr)}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`<div class="action-row" style="margin-top:16px;">
    <button class="btn btn-sky" onclick="printLog()">🖨️ Print Log</button>
  </div>
  </div>`;
  document.getElementById('app').innerHTML=html;
}

function printLog(){
  const w=window.open('','_blank');
  const entries=[...state.log].reverse();
  const rows=entries.map(e=>{
    const d=new Date(e.ts);
    const dateStr=isNaN(d.getTime())?'':d.toLocaleString();
    return `<tr>
      <td>${esc(dateStr)}</td>
      <td>${esc(e.unitTitle||e.unitKey)}</td>
      <td>Level ${(e.levelIdx||0)+1}</td>
      <td>${e.phase==='story'?'Story Step':'Practice'}</td>
      <td>${e.passed?'Passed':'Try Again'} (${e.passCount}/${e.total})</td>
      <td>${esc(e.text)}</td>
    </tr>`;
  }).join('');
  w.document.write(`<html><head><title>${esc(state.studentName)} - Writing Log</title>
    <style>body{font-family:Georgia,serif;max-width:900px;margin:30px auto;padding:0 20px;}
    h1{font-size:1.3rem;} .meta{color:#666;font-size:.85rem;margin-bottom:20px;}
    table{width:100%;border-collapse:collapse;font-size:.85rem;}
    th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;}
    th{background:#f1f5f9;}</style>
    </head><body>
    <h1>${esc(state.studentName)}'s Writing Log</h1>
    <p class="meta">Writing Workshop — ${entries.length} submission${entries.length===1?'':'s'}</p>
    <table><thead><tr><th>Date</th><th>Unit</th><th>Level</th><th>Type</th><th>Result</th><th>What they wrote</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6"><em>Nothing submitted yet.</em></td></tr>'}</tbody></table>
    </body></html>`);
  w.document.close();
  w.print();
}

function printLevel(){
  const unit=DATA[state.grade].units[state.unitKey];
  const lvl=currentLevel();
  const prompt=currentPrompt();
  const w=window.open('','_blank');
  let scaffold='';
  let lines;
  let unitNoun='Sentence';
  if(lvl.scaffoldType==='wordbank-starter'){
    scaffold=`<p><strong>Sentence Starter:</strong> ${esc(prompt.starter)}</p><p><strong>Word Bank:</strong> ${prompt.wordBank.map(esc).join(', ')}</p>`;
    lines=Array(6).fill('<div style="border-bottom:1px solid #999;height:34px;"></div>').join('');
  } else if(lvl.scaffoldType==='starter'){
    scaffold=`<p><strong>Sentence Starter:</strong> ${esc(prompt.starter)}</p>`;
    lines=Array(6).fill('<div style="border-bottom:1px solid #999;height:34px;"></div>').join('');
  } else if(lvl.scaffoldType==='emoji-wordbank'){
    unitNoun='Label';
    scaffold=`<div style="font-size:3.5rem;text-align:center;margin:10px 0;">${prompt.emoji}</div><p><strong>Word Bank:</strong> ${prompt.wordBank.map(esc).join(', ')}</p>`;
    lines=Array(2).fill('<div style="border-bottom:1px solid #999;height:34px;"></div>').join('');
  } else if(lvl.scaffoldType==='list'){
    unitNoun='List';
    scaffold=`<p><em>Write one item on each line.</em></p>`;
    const n=Math.max(lvl.target.minItems||4, 4);
    lines=Array(n).fill(0).map((_,i)=>`<div style="display:flex;gap:8px;align-items:center;"><span style="color:#999;">${i+1}.</span><div style="flex:1;border-bottom:1px solid #999;height:32px;"></div></div>`).join('');
  } else {
    lines=Array(6).fill('<div style="border-bottom:1px solid #999;height:34px;"></div>').join('');
  }
  const checklist=lvl.checklist.map(c=>`<li>☐ ${esc(c)}</li>`).join('');
  w.document.write(`<html><head><title>${esc(unit.title)} - Level ${state.levelIdx+1}</title>
    <style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;line-height:1.7;padding:0 20px;}
    h1{font-size:1.3rem;} .meta{color:#666;font-size:.85rem;margin-bottom:20px;}
    ul{margin:16px 0 16px 20px;} li{list-style:none;margin-bottom:6px;}</style>
    </head><body>
    <h1>${esc(unit.title)} — Level ${state.levelIdx+1} (${esc(unitNoun)} ${state.repsDone+1} of ${lvl.reps})</h1>
    <p class="meta">${esc(DATA[state.grade].label)} Writing Workshop</p>
    <p><strong>Prompt:</strong> ${esc(prompt.text)}</p>
    <p style="background:#fef9c3;border:1px solid #fde68a;padding:8px 12px;border-radius:6px;margin:10px 0;">🗣️ <strong>Before you write:</strong> Say your answer out loud to a partner or the teacher first!</p>
    ${scaffold}
    <div style="margin:24px 0;display:flex;flex-direction:column;gap:6px;">${lines}</div>
    <p><strong>Checklist:</strong></p><ul>${checklist}</ul>
    </body></html>`);
  w.document.close();
  w.print();
}

// ── QUIZ ──
let userAnswers=[];
function showQuiz(){
  const qs=QUIZ[state.unitKey][state.levelIdx];
  userAnswers=new Array(qs.length).fill(null);
  const area=document.getElementById('quiz-area');
  area.style.display='block';
  renderQuiz(qs);
  area.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderQuiz(qs){
  let html=`<div class="quiz-wrap slide-up"><h2>📝 Skill Quiz</h2><div class="quiz-sub">Test what you know about this writing skill</div>`;
  qs.forEach((q,qi)=>{
    html+=`<div class="quiz-q"><div class="quiz-q-text">Q${qi+1}: ${esc(q.q)}</div><div class="quiz-opts">`;
    q.opts.forEach((opt,oi)=>{ html+=`<button class="qopt" id="qo-${qi}-${oi}" onclick="pickAnswer(${qi},${oi})">${esc(opt)}</button>`; });
    html+=`</div></div>`;
  });
  html+=`<button class="btn btn-sky" onclick="submitQuiz()" style="width:100%;margin-top:4px;">✓ Check My Answers</button><div id="quiz-result" style="margin-top:14px;"></div></div>`;
  document.getElementById('quiz-area').innerHTML=html;
}
function pickAnswer(qi,oi){
  userAnswers[qi]=oi;
  const qs=QUIZ[state.unitKey][state.levelIdx];
  for(let i=0;i<qs[qi].opts.length;i++){
    const b=document.getElementById(`qo-${qi}-${i}`);
    if(b) b.className='qopt'+(i===oi?' selected':'');
  }
}
function submitQuiz(){
  const qs=QUIZ[state.unitKey][state.levelIdx];
  let correct=0;
  qs.forEach((q,qi)=>{
    for(let oi=0;oi<q.opts.length;oi++){
      const b=document.getElementById(`qo-${qi}-${oi}`);
      if(!b) continue;
      b.disabled=true;
      if(oi===q.a) b.classList.add('correct');
      else if(oi===userAnswers[qi] && userAnswers[qi]!==q.a) b.classList.add('wrong');
    }
    if(userAnswers[qi]===q.a) correct++;
  });
  const pct=Math.round((correct/qs.length)*100);
  let msg = pct===100? '🏆 Perfect!' : pct>=50? '⭐ Good job!' : '📖 Review the checklist and try again!';
  document.getElementById('quiz-result').innerHTML=`<div class="quiz-score"><div class="quiz-score-big">${correct}/${qs.length}</div><div class="quiz-score-msg">${msg}</div></div>`;
}

// ── INIT ──
initApp();
renderStreak();
function render(){
  if(state.unitKey && document.getElementById('writing-input')) renderWriteScreen();
  else if(state.unitKey) showLevelPicker(state.unitKey);
  else if(state.grade) showUnitPicker(state.grade);
  else showGradePicker();
}
</script>
